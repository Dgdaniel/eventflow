services:
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper
    platform: linux/amd64
    ports:
      - "2182:2181"
    volumes:
      - zookeeper-data:/opt/zookeeper-3.4.13/data
      - zookeeper-log:/opt/zookeeper-3.4.13/logs
    networks:
      - kafka-net

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka
    platform: linux/amd64
    ports:
      - "9097:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9097
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /kafka/kafka-logs
    volumes:
      - kafka-data:/kafka
    networks:
      - kafka-net
    depends_on:
      - zookeeper
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: eventflowapp-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - kafka-net

  postgres:
    image: postgres:17-alpine
    container_name: eventflowapp-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: eventflowapp
      POSTGRES_PASSWORD: eventflowapp
      POSTGRES_DB: eventflowapp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kafka-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U eventflowapp" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # redis:
  #   image: redis:7-alpine
  #   container_name: eventflowapp-redis
  #   ports:
  #     - "6380:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - kafka-net
  #   healthcheck:
  #     test: [ "CMD", "redis-cli", "ping" ]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: eventflowapp-mailhog
    ports:
      - "1026:1025"
      - "8026:8025"
    volumes:
      - mailhog-data:/data
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  mailhog-data:
  postgres-data:
  redis-data:
